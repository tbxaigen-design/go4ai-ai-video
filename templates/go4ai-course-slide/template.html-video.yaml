id: go4ai-course-slide
name: "GO4AI Course & Tech Slide (16:9)"
description: "Mẫu video ngang 16:9 chuẩn 1920x1080 cho bài giảng GO4AI Academy, video thuyết trình kỹ thuật, slide 2 cột có code box và dữ liệu trực quan."
category: "education-tech"
tags: ["go4ai", "course", "slide", "16:9", "horizontal", "academy", "code", "tech"]
best_for:
  - "bài giảng trực tuyến"
  - "slide thuyết trình kỹ thuật"
  - "video khoá học"
  - "hướng dẫn có code"
engine: hyperframes
source_entry: "source/index.html"
author: "GO4AI Academy Team"

spec_version: 1
version: 0.1.0
engine_version: ^0.4.0
subcategory: course-slide

output:
  formats: [mp4, webm]
  default_format: mp4
  resolution:
    default: { width: 1920, height: 1080 }
    supported_aspects: ["16:9"]
  fps:
    default: 60
    supported: [30, 60]
  duration:
    type: variable
    min_sec: 4
    max_sec: 15
  alpha: false
  audio:
    supported: true
    expected_inputs: [bgm, narration]

license:
  spdx: Apache-2.0
  attribution_required: true
  redistribution_allowed: true
  commercial_use: true
