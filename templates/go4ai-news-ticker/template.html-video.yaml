id: go4ai-news-ticker
name: "GO4AI News Ticker (16:9 & 9:16)"
description: "Mẫu video điểm tin công nghệ và bản tin AI tuần của GO4AI với thanh Breaking News ticker chạy chữ liên tục, 3 thẻ tin nổi bật và hiệu ứng ánh sáng hiện đại."
category: "news-explainer"
tags: ["go4ai", "news", "ticker", "breaking-news", "weekly-ai", "16:9", "9:16", "tech"]
best_for:
  - "bản tin công nghệ"
  - "điểm tin AI hàng tuần"
  - "breaking news"
  - "tổng hợp tin ngắn"
engine: hyperframes
source_entry: "source/index.html"
author: "GO4AI Media Team"

spec_version: 1
version: 0.1.0
engine_version: ^0.4.0
subcategory: news-ticker

output:
  formats: [mp4, webm]
  default_format: mp4
  resolution:
    default: { width: 1920, height: 1080 }
    supported_aspects: ["16:9", "9:16"]
  fps:
    default: 60
    supported: [30, 60]
  duration:
    type: variable
    min_sec: 4
    max_sec: 20
  alpha: false
  audio:
    supported: true
    expected_inputs: [bgm, narration]

license:
  spdx: Apache-2.0
  attribution_required: true
  redistribution_allowed: true
  commercial_use: true
