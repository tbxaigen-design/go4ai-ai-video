id: go4ai-tech-shorts
name: "GO4AI Tech Shorts (9:16)"
description: "Mẫu video dọc 9:16 phong cách hiện đại cho TikTok/Reels/Shorts nội bộ GO4AI. Tối ưu cho video chia sẻ mẹo công nghệ, tin vắn AI và giới thiệu tính năng."
category: "social-shorts"
tags: ["go4ai", "shorts", "tiktok", "reels", "tech", "dark-mode", "vertical", "9:16"]
best_for:
  - "video ngắn TikTok/Reels"
  - "mẹo công nghệ"
  - "tin vắn AI"
  - "giới thiệu tính năng"
engine: hyperframes
source_entry: "source/index.html"
author: "GO4AI Design Team"

spec_version: 1
version: 0.1.0
engine_version: ^0.4.0
subcategory: social-vertical

output:
  formats: [mp4, webm]
  default_format: mp4
  resolution:
    default: { width: 1080, height: 1920 }
    supported_aspects: ["9:16"]
  fps:
    default: 60
    supported: [30, 60]
  duration:
    type: variable
    min_sec: 3
    max_sec: 12
  alpha: false
  audio:
    supported: true
    expected_inputs: [bgm, narration]

license:
  spdx: Apache-2.0
  attribution_required: true
  redistribution_allowed: true
  commercial_use: true
